<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <title>简易计算器</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="calculator">

    <!-- 显示区：种子，别改 -->

  </main>

  <!-- 只用原生 JS：全部逻辑就这一个文件，不分层、不引框架 -->
  <script src="js/main.js"></script>
